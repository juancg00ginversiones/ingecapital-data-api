name: Update Portfolios Data

on:
  schedule:
    - cron: '0 8 * * 0'  # Todos los domingos a las 8am UTC
  workflow_dispatch:       # También se puede correr manualmente

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance numpy pandas

      - name: Run portfolios script
        run: python generate_portfolios.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolios_data.json
          git diff --staged --quiet || git commit -m "📊 Update portfolios data $(date +%Y-%m-%d)"
          git push
